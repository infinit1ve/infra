# This example uses YAML anchors which allows reuse of multiple keys
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/d6114726d859df36ccaa32891c4963ae5717ef7f/nixos/.sops.yaml
# for a more complex example.
#
# The keyscan can be done from the local machine, not the server
# ssh-keyscan -t ed25519 <host> 2>/dev/null | ssh-to-age
# sops updatekeys secrets/secrets.yaml && sops updatekeys homelab/helm/values/vaultwarden/secrets.yaml
keys:
  - &primary age19srrknrehu57y76vfsy067t5x7chjnk67xmw7h6jsesxupaj7gasxtv2t5
  - &mirax-nix age1254fh4urg28yvefw7w28mz0wndzw7afehvmvaqrfnfkwnzt5hagsa8ts6x
  - &nolax-nix age13xfg39rfvzk7e8e82q05uzntc3vkw9u77pgm2ps387kc7hh2xeesnsrcxu
  - &sonax-nix age1w6zamywre4vkwpq8c56zr8rpxesuhyxwqavz3639q5sxyx40je3ss3lrgs
creation_rules:
  - path_regex: (secrets|helm\/values\/vaultwarden)\/secrets\.yaml$
    key_groups:
    - age:
      - *primary
      - *mirax-nix
      - *nolax-nix
      - *sonax-nix
