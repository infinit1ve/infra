apiVersion: apps/v1
kind: DaemonSet
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: kube-vip-ds
    app.kubernetes.io/version: v1.3.1
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-ds
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: kube-vip-ds
        app.kubernetes.io/version: v1.3.1
    spec:
      containers:
        - args:
            - manager
          env:
            - name: port
              value: '6443'
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: dns_mode
              value: first
            - name: prometheus_server
              value: ':2112'
            - name: vip_arp
              value: 'true'
            - name: vip_subnet
              value: '24' # Define your subnet here
            - name: vip_address
              value: 10.12.3.200 # Choose a virtual IP for the cluster
            - name: cp_enable
              value: 'true'
            - name: cp_namespace
              value: kube-system
            - name: vip_loglevel
              value: '0'
            - name: svc_enable
              value: 'true'
          image: ghcr.io/kube-vip/kube-vip:v1.3.1
          imagePullPolicy: IfNotPresent
          name: kube-vip
          resources: {}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - mountPath: /etc/kubernetes/admin.conf
              name: kubeconfig
      hostAliases:
        - hostnames:
            - kubernetes
          ip: 127.0.0.1
      hostNetwork: true
      volumes:
        - hostPath:
            path: /etc/kubernetes/admin.conf
          name: kubeconfig
      serviceAccountName: kube-vip
