resources:
- apiVersion: longhorn.io/v1beta2
  kind: RecurringJob
  metadata:
    name: weekly-backup
    namespace: longhorn-system
  spec:
    cron: "0 4 * * 0"    # Every Sunday at 4 AM
    task: "backup"
    groups:
      - default
    retain: 8             # Keep 8 weeks of backups
    concurrency: 1
