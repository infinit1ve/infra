repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts
---
environments:
  default:
    secrets:
      - ../../../../secrets/secrets.yaml
---
releases:
  - name: vaultwarden
    namespace: vaultwarden
    chart: bjw-s/app-template
    version: 5.3.0
    values:
      - ./vaultwarden.yaml.gotmpl
  - name: vaultwarden-db
    installed: true
    namespace: vaultwarden
    chart: bedag/raw
    values:
      - ./vaultwarden-db.yaml
  - name: bw-portal-secret
    installed: true
    namespace: vaultwarden
    chart: bedag/raw
    secrets:
      - ./secrets.yaml
    values:
      - ./vaultwarden-secret.yaml
