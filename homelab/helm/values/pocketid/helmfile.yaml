repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts
---
environments:
  default:
    secrets:
      - ../../../../secrets/secrets.yaml
---
releases:
  - name: pocketid
    namespace: pocketid
    chart: bjw-s/app-template
    version: 5.3.0
    values:
      - ./pocketid.yaml.gotmpl
  - name: pocketid-db
    namespace: pocketid
    chart: bedag/raw
    values:
      - ./pocketid-db.yaml
