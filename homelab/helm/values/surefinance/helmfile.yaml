repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts
---
environments:
  default:
    secrets:
      - ../../../../secrets/secrets.yaml
---
releases:
  - name: sure
    namespace: sure-finance
    chart: bjw-s/app-template
    version: 5.3.0
    values:
      - ./sure.yaml.gotmpl
  - name: sure-db
    namespace: sure-finance
    chart: bedag/raw
    values:
      - ./sure-db.yaml
