repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts
---
environments:
  default:
    secrets:
      - ../../../../secrets/secrets.yaml
---
releases:
  - name: paperless
    namespace: paperless
    chart: bjw-s/app-template
    version: 5.3.0
    values:
      - ./paperless.yaml.gotmpl
  - name: paperless-db
    installed: true
    namespace: paperless
    chart: bedag/raw
    values:
      - ./paperless-db.yaml
