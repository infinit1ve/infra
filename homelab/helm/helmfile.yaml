repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: longhorn
    url: https://charts.longhorn.io
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts
  - name: descheduler
    url: https://kubernetes-sigs.github.io/descheduler/
---
environments:
  default:
    secrets:
      - ../../secrets/secrets.yaml
---
releases:
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    version: 1.13.0
    values:
      - ./values/longhorn/longhorn.yaml.gotmpl
  - name: backupjobs
    namespace: longhorn-system
    chart: bedag/raw
    values:
      - ./values/longhorn/backupjobs.yaml
  - name: kube-prometheus-stack
    installed: false
    namespace: prometheus
    chart: prometheus-community/kube-prometheus-stack
    version: 93.11.1
    values:
      - ./values/kube-prometheus.yaml.gotmpl
  - name: my-descheduler
    namespace: descheduler
    chart: descheduler/descheduler
    version: 0.37.0
  - name: searxng
    namespace: searxng
    chart: bjw-s/app-template
    version: 5.3.0
    values:
      - ./values/searxng.yaml.gotmpl
---
helmfiles:
  - ./values/cert-manager/helmfile.yaml
  - ./values/cnpg/helmfile.yaml
  - ./values/vaultwarden/helmfile.yaml
  - ./values/pocketid/helmfile.yaml
  - ./values/paperless/helmfile.yaml
  - ./values/navidrome/helmfile.yaml
  - ./values/ghost/helmfile.yaml
  - ./values/redirects/helmfile.yaml
  - ./values/surefinance/helmfile.yaml
  - ./values/forgejo/helmfile.yaml
